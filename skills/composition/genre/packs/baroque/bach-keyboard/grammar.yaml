    - id: R01
      rule: 强拍音必须是和弦音，或者是下一音级进解决的倚音（语料强拍和弦音 77%）
      param:
        strict_ct_threshold: 0.7
        corpus_ct_rate: 0.766
        strict: true
    - id: R02
      rule: 半音外音必须级进进入或级进离开；调内非和弦音可以跳进（语料非和弦音级进比例只有 77%）
      param:
        strict_step_threshold: 0.85
        corpus_step_rate: 0.771
        strict: false
    - id: R03
      rule: 旋律跳进不超过 11 个半音（语料 99.5% 分位）
      param:
        max_leap: 11
    - id: R05
      rule: 旋律音域 MIDI 58–82（语料 1%–99% 分位）
      param:
        range_low: 58
        range_high: 82
    - id: R06
      rule: 全曲结束于主和弦，旋律末音为主音
    - id: R07
      rule: 和弦只用词表内的和弦，和弦转移必须在语料中出现过
    - id: R08
      rule: 钢琴右手（旋律）与左手伴奏之间不得同向进入平行五度 / 八度（左手和弦按高→低拆成声部逐条检查，同手内只查五度）；左手不高过旋律，低音不高过旋律
    - id: R10
      rule: 同一个和弦连续不超过 3 小节（语料 95% 分位）
      param:
        max_same_chord_bars: 3
    - id: R09
      rule: 每小节的节奏取自学到的节奏模板（R 规则）
