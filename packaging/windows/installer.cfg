[Application]
name=Score Studio
version=1.0.0
publisher=Score Studio
entry_point=score_studio:main
console=false
license_file=../../LICENSE
extra_preamble=preamble.py

[Python]
version=3.12.10
bitness=64
include_msvcrt=true

[Include]
local_wheels=../../build/wheelhouse/*.whl
files=../../build/payload/batch_generate.py
    ../../build/payload/brief_expand.py
    ../../build/payload/chord_advisor.py
    ../../build/payload/compose_groove.py
    ../../build/payload/compose_kernel.py
    ../../build/payload/composition_skills.py
    ../../build/payload/composition_skill_ui.py
    ../../build/payload/deliver.py
    ../../build/payload/evaluate.py
    ../../build/payload/gen_help_pro.py
    ../../build/payload/help_doc.py
    ../../build/payload/i18n.py
    ../../build/payload/LICENSE
    ../../build/payload/llm_compose.py
    ../../build/payload/llm_config.example.json
    ../../build/payload/main.py
    ../../build/payload/master_audit.py
    ../../build/payload/musicxml_roundtrip.py
    ../../build/payload/narrative.py
    ../../build/payload/notation.py
    ../../build/payload/README.md
    ../../build/payload/README.zh-CN.md
    ../../build/payload/refine_style.py
    ../../build/payload/render_enhance.py
    ../../build/payload/REPRODUCIBILITY.md
    ../../build/payload/RULES.md
    ../../build/payload/rule_library.py
    ../../build/payload/score_reverse.py
    ../../build/payload/score_studio.py
    ../../build/payload/studio_daw.py
    ../../build/payload/style_contract.py
    ../../build/payload/style_interpolate.py
    ../../build/payload/style_routing.py
    ../../build/payload/style_skeleton.py
    ../../build/payload/systems.py
    ../../build/payload/score_learning > $INSTDIR
    ../../build/payload/music_score > $INSTDIR
    ../../build/payload/skills > $INSTDIR
    ../../build/payload/assets > $INSTDIR
    ../../build/payload/scores > $INSTDIR
    ../../build/payload/docs > $INSTDIR
    ../../build/payload/runs > $INSTDIR

[Build]
directory=../../build/nsis
installer_name=ScoreStudio-1.0.0-win64.exe
